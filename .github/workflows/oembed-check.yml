name: TEMP oEmbed CORS check
on:
  push:
    branches: [feature/schema-v2]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3DjNQXAC9IVRw&format=json" "https://www.youtube.com/oembed?url=https%3A%2F%2Fyoutu.be%2FjNQXAC9IVRw&format=json"; do
            echo "== GET $u"; curl -sS -D - -o body.json -H "Origin: https://satoshibjj.github.io" "$u" | grep -iE "^HTTP|access-control|content-type"; head -c 300 body.json; echo
          done
          echo "== OPTIONS"; curl -sS -X OPTIONS -D - -o /dev/null -H "Origin: https://satoshibjj.github.io" -H "Access-Control-Request-Method: GET" "https://www.youtube.com/oembed?url=x&format=json" | grep -iE "^HTTP|access-control"
