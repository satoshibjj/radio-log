<!doctype html>
<html lang="ja" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1B33" />
    <meta name="description" content="また聴き返したいラジオ（Podcast・YouTube なども）の回を、出演者・聴きどころ・リンクと一緒にストックする個人用アプリ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Radio Log" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Radio Log</title>
    <script>
      // 表示テーマを描画前に当てる（ちらつき防止。src/lib/theme.ts と同じ規則）
      (function () {
        var p = 'night';
        try { p = localStorage.getItem('radiolog.theme') || 'night'; } catch (e) {}
        if (p === 'system') p = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
        if (p !== 'day') p = 'night';
        document.documentElement.setAttribute('data-theme', p);
        if (p === 'day') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EFE7D6');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
